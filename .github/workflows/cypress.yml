name: Cypress E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cypress-tests:
    name: Validar os 10 casos no Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar o codigo
        run: npm run lint

      - name: Instalar e verificar o aplicativo Cypress
        run: |
          npx cypress install
          npx cypress verify

      - name: Executar a suite e gerar relatorios
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: npm test

      - name: Publicar relatorios e evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence-${{ github.run_number }}
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn
          retention-days: 14
